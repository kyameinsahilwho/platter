<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Platter</title>
  <link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="modulepreload" href="app.js" />
  <link rel="modulepreload" href="icons.js" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Apply the saved theme before first paint so there's no light flash in dark mode.
    try { const t = localStorage.getItem("platter.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="rail" aria-label="Drives and tools">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="1" y="1" width="30" height="30" rx="8" fill="var(--pine)" />
          <circle cx="16" cy="16" r="10.5" fill="var(--brand-paper)" />
          <path d="M16 16 L16 5.5 A10.5 10.5 0 0 1 25.4 11.3 Z" fill="var(--warn)" />
          <circle cx="16" cy="16" r="3.2" fill="var(--pine)" />
          <circle cx="16" cy="16" r="1.1" fill="var(--brand-paper)" />
        </svg>
        <span class="brand-name">Platter</span>
      </div>

      <nav class="rail-nav" id="rail-nav"></nav>

      <div class="rail-foot">
        <div id="elevation"></div>
        <div class="theme-switch" role="radiogroup" aria-label="Theme">
          <button type="button" role="radio" data-theme-choice="light" aria-label="Light theme" title="Light"></button>
          <button type="button" role="radio" data-theme-choice="system" aria-label="Match Windows" title="Match Windows"></button>
          <button type="button" role="radio" data-theme-choice="dark" aria-label="Dark theme" title="Dark"></button>
        </div>
      </div>
    </aside>

    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <dialog class="dialog" id="dialog"></dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
